<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nutho Device Transfer</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #eee; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; text-align: center; padding: 16px; }
    .box { max-width: 420px; }
  </style>
</head>
<body>
  <div class="box">
    <h2 id="title">กำลังเชื่อมต่อ…</h2>
    <p id="msg">หน้าต่างนี้จะปิดเอง</p>
  </div>
  <script>
    // Static page: it only hands the OAuth result (authorization code + state) to the window that opened it.
    // The code is useless without the PKCE verifier, which never leaves that window.
    (function () {
      var p = new URLSearchParams(location.search);
      var result = { source: 'nutho-device-transfer', state: p.get('state'), code: p.get('code'), error: p.get('error_description') || p.get('error') };
      var opener = window.opener;
      if (!opener) {
        document.getElementById('title').textContent = 'เปิดหน้านี้ตรงๆ ไม่ได้';
        document.getElementById('msg').textContent = 'กลับไปที่ SillyTavern แล้วกดเชื่อมต่อจาก Extension';
        return;
      }
      opener.postMessage(result, '*');
      document.getElementById('title').textContent = result.error ? 'เชื่อมต่อไม่สำเร็จ' : 'เชื่อมต่อแล้ว';
      document.getElementById('msg').textContent = result.error ? result.error : 'ปิดหน้าต่างนี้ได้เลย';
      setTimeout(function () { window.close(); }, 800);
    })();
  </script>
</body>
</html>
