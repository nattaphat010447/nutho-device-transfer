<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nutho Device Transfer</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #eee; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; text-align: center; padding: 16px; }
    .box { max-width: 420px; width: 100%; }
    textarea { width: 100%; box-sizing: border-box; background: #000; color: #eee; border: 1px solid #555; border-radius: 6px; padding: 8px; font: 14px monospace; resize: none; }
    button { margin-top: 8px; padding: 8px 16px; border-radius: 6px; border: 1px solid #555; background: #333; color: #eee; cursor: pointer; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <div class="box">
    <h2 id="title">กำลังเชื่อมต่อ…</h2>
    <p id="msg">หน้าต่างนี้จะปิดเอง</p>
    <div id="manual" hidden>
      <textarea id="code" rows="3" readonly></textarea>
      <button id="copy" type="button">คัดลอกรหัส</button>
    </div>
  </div>
  <script>
    // Static page: it hands the OAuth result (authorization code + state) to the window that opened it.
    // The code is useless without the PKCE verifier, which never leaves that window.
    // If the browser cut the link to that window, show the code so it can be pasted into the extension instead.
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var p = new URLSearchParams(location.search);
      var result = { source: 'nutho-device-transfer', state: p.get('state'), code: p.get('code'), error: p.get('error_description') || p.get('error') };

      if (result.error || !result.code) {
        $('title').textContent = 'เชื่อมต่อไม่สำเร็จ';
        $('msg').textContent = result.error || 'ไม่พบรหัสจาก Dropbox กลับไปที่ SillyTavern แล้วกดเชื่อมต่อใหม่';
        return;
      }

      var sent = false;
      try {
        if (window.opener) { window.opener.postMessage(result, '*'); sent = true; }
      } catch (e) { /* opener unreachable */ }

      if (sent) {
        $('title').textContent = 'เชื่อมต่อแล้ว';
        $('msg').textContent = 'ปิดหน้าต่างนี้ได้เลย ถ้าใน SillyTavern ยังไม่ขึ้นว่าเชื่อมต่อแล้ว ให้คัดลอกรหัสด้านล่างไปวาง';
        setTimeout(function () { window.close(); }, 1500);
      } else {
        $('title').textContent = 'คัดลอกรหัสนี้';
        $('msg').textContent = 'กลับไปที่ SillyTavern แล้ววางรหัสนี้ในช่อง "รหัสจาก Dropbox"';
      }
      $('manual').hidden = false;
      $('code').value = result.code;
      $('copy').addEventListener('click', function () {
        $('code').select();
        (navigator.clipboard ? navigator.clipboard.writeText(result.code) : Promise.reject()).catch(function () { document.execCommand('copy'); });
        $('copy').textContent = 'คัดลอกแล้ว';
      });
    })();
  </script>
</body>
</html>
